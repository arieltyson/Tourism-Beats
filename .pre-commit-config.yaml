# .pre-commit-config.yaml
# Single hook: format → autocorrect → restage → lint (all atomic).

repos:
  - repo: local
    hooks:
      - id: swift-format-and-lint
        name: SwiftFormat + SwiftLint
        entry: bash -lc 'export PATH="/opt/homebrew/bin:$PATH"; swiftformat . --swiftversion 6.2 --config .swiftformat && swiftlint --autocorrect --format --quiet; git add -A && swiftlint'
        language: system
        types: [swift]
        pass_filenames: false
        stages: [pre-commit]
