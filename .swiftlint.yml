# .swiftlint.yml

# Only lint project source — exclude generated code, tests, and build artifacts.
included:
  - Tourism Beats

excluded:
  - Tourism BeatsTests
  - Tourism BeatsUITests
  - .build
  - DerivedData

# Relax identifier_name to allow common short names (x, y, i, etc.)
# while still catching truly meaningless names.
identifier_name:
  min_length:
    warning: 1
    error: 1
  max_length:
    warning: 60
    error: 80
  allowed_symbols: ["_"]
  excluded:
    - id
    - no
    - to
    - ok

# Allow underscores in type names (e.g., Tourism_BeatsApp generated by Xcode).
type_name:
  allowed_symbols: ["_"]
  min_length:
    warning: 3
    error: 3
  max_length:
    warning: 50
    error: 60

# Raise thresholds for body/file length to avoid blocking on existing code.
file_length:
  warning: 500
  error: 800

type_body_length:
  warning: 400
  error: 600

function_body_length:
  warning: 60
  error: 100

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

cyclomatic_complexity:
  warning: 15
  error: 25

# Disable rules that conflict with SwiftFormat or are too noisy.
disabled_rules:
  - opening_brace
  - multiple_closures_with_trailing_closure
  - nesting
  - static_over_final_class
